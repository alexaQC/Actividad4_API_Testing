name: Pruebas API con Newman

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar colección de Postman
        run: |
          newman run "Actividad4_Pruebas_API.postman_collection.json" \
            -e "Actividad4_Environment.postman_environment.json"
